<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Photoelasticity — Index & Middle / Rainbow</title>
<style>
:root{
  --bg:#07090d;
  --panel:rgba(16,20,27,.78);
  --line:rgba(255,255,255,.18);
  --text:#f5f7fb;
  --muted:#aab2c0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;overflow:hidden}
.app{position:relative;width:100vw;height:100vh;background:#05070a}
video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scaleX(-1);
  filter:brightness(.42) saturate(.72) blur(1px);
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sim{z-index:2}
#hud{z-index:3;pointer-events:none}
.panel{
  position:absolute;z-index:5;left:16px;top:16px;width:min(430px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;backdrop-filter:blur(14px);
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input[type=range],button{width:100%}
select,button{
  border:1px solid var(--line);background:#121722;color:var(--text);
  border-radius:10px;padding:9px 10px;font-size:14px
}
button{cursor:pointer}
button.primary{background:#16384b;border-color:#285f7d}
button:disabled{opacity:.55;cursor:not-allowed}
.rangeWrap{margin-top:10px}
.rangeReadout{font-size:11px;color:var(--muted);margin-top:3px}
.status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
.status strong{color:var(--text)}
.legend{
  position:absolute;z-index:5;right:16px;bottom:16px;max-width:420px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;backdrop-filter:blur(12px);font-size:12px;color:var(--muted);
  line-height:1.55
}
.badge{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--text)}
.small{font-size:11px;color:var(--muted)}
@media (max-width:640px){
  .panel{left:10px;top:10px;width:calc(100vw - 20px)}
  .legend{left:10px;right:10px;bottom:10px;max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <video id="video" playsinline muted></video>
  <canvas id="sim"></canvas>
  <canvas id="hud"></canvas>

  <div class="panel">
    <div class="row">
      <div>
        <label for="mode">表示</label>
        <select id="mode">
          <option value="color" selected>明るいレインボー</option>
          <option value="mono">白黒縞</option>
        </select>
      </div>
      <div>
        <label for="frameScale">正方形サイズ</label>
        <input id="frameScale" type="range" min="0.55" max="0.88" value="0.72" step="0.01">
        <div id="frameScaleReadout" class="rangeReadout"></div>
      </div>
    </div>

    <div class="rangeWrap">
      <label for="delay">干渉タイムラグ</label>
      <input id="delay" type="range" min="0" max="2.5" value="1.0" step="0.05">
      <div id="delayReadout" class="rangeReadout"></div>
    </div>

    <div class="rangeWrap">
      <label for="gain">光弾性感度</label>
      <input id="gain" type="range" min="1" max="14" value="7.0" step="0.1">
    </div>

    <div class="rangeWrap">
      <label for="pressureGain">指先圧力</label>
      <input id="pressureGain" type="range" min="0.3" max="3.5" value="1.35" step="0.05">
    </div>

    <div class="rangeWrap">
      <label for="dentStrength">へこみ表現</label>
      <input id="dentStrength" type="range" min="0" max="2.4" value="1.0" step="0.05">
    </div>

    <div class="rangeWrap">
      <label for="relax">残留時間</label>
      <input id="relax" type="range" min="0.82" max="0.99" value="0.94" step="0.005">
    </div>

    <div class="row" style="margin-top:10px">
      <button id="startCam" class="primary">カメラ開始</button>
      <button id="reset">リセット</button>
    </div>

    <div id="status" class="status">
      <strong>操作:</strong> 人差し指と中指だけが反応します。<br>
      白枠内は透明で、指が触れた応力領域だけ干渉縞が設定したタイムラグ後に表示されます。
    </div>
  </div>

  <div class="legend">
    <span class="badge">人差し指 + 中指のみ</span>
    <span class="badge">タイムラグ可変</span>
    <span class="badge">透明板</span> <span class="badge">明るいレインボー</span><br>
    <div class="small">ベース技術: Google MediaPipe Hands（21点ランドマーク）</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const sim = document.getElementById('sim');
  const hud = document.getElementById('hud');
  const ctx = sim.getContext('2d');
  const hctx = hud.getContext('2d');

  const modeEl = document.getElementById('mode');
  const frameScaleEl = document.getElementById('frameScale');
  const frameScaleReadout = document.getElementById('frameScaleReadout');
  const delayEl = document.getElementById('delay');
  const delayReadout = document.getElementById('delayReadout');
  const gainEl = document.getElementById('gain');
  const pressureGainEl = document.getElementById('pressureGain');
  const dentStrengthEl = document.getElementById('dentStrength');
  const relaxEl = document.getElementById('relax');
  const startCamBtn = document.getElementById('startCam');
  const resetBtn = document.getElementById('reset');
  const statusEl = document.getElementById('status');

  let W=0,H=0,DPR=1;
  let camera=null,handsReady=false;
  let activeLoads = [];
  let persistentLoads = [];

  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');

  // 人差し指先(8)・中指先(12)のみ
  const TRACK_IDS = [8,12];
  const TRACK_LABELS = ['index','middle'];
  const fingerWeights = {
    index: 1.10,
    middle: 1.00
  };

  const fingertips = Array.from({length:4}, (_,i)=>({
    visible:false,
    x:0,y:0,
    px:0,py:0,
    pressure:0,
    weight:1,
    label:TRACK_LABELS[i%2],
    history:[]
  }));

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;

  function updateReadouts(){
    delayReadout.textContent = `現在: ${(+delayEl.value).toFixed(2)} 秒`;
    frameScaleReadout.textContent = `現在: ${(Number(frameScaleEl.value)*100).toFixed(0)} %`;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for(const c of [sim,hud]){
      c.width = Math.round(W*DPR);
      c.height = Math.round(H*DPR);
      c.style.width = W+'px';
      c.style.height = H+'px';
      c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
    }
  }

  function specimenBounds(){
    const sizeRatio = Number(frameScaleEl.value);
    const side = Math.min(W*sizeRatio, H*sizeRatio, 560);
    return {cx:W/2, cy:H/2+20, side};
  }

  function baseInside(x,y){
    const {cx,cy,side}=specimenBounds();
    return Math.abs(x-cx) <= side/2 && Math.abs(y-cy) <= side/2;
  }

  function signedInteriorDepth(x,y){
    const {cx,cy,side}=specimenBounds();
    const left = x-(cx-side/2);
    const right = (cx+side/2)-x;
    const top = y-(cy-side/2);
    const bottom = (cy+side/2)-y;
    return Math.min(left,right,top,bottom);
  }

  function stressField(x,y){
    let sx=0, sy=0, tau=0;
    const loads = activeLoads.concat(persistentLoads);

    for(const L of loads){
      const dx=x-L.x, dy=y-L.y;
      const r2=dx*dx+dy*dy+95;
      const r=Math.sqrt(r2);
      const nx=dx/r, ny=dy/r;
      const k=L.p*9200/r2;
      sx += k*(1.8*nx*nx+.25);
      sy += k*(1.8*ny*ny+.25);
      tau += k*(1.65*nx*ny);
    }

    return Math.sqrt((sx-sy)*(sx-sy)+4*tau*tau);
  }

  function dentField(x,y){
    let v = 0;
    const dentStrength = +dentStrengthEl.value;
    for(const L of activeLoads){
      const dx = x-L.x, dy = y-L.y;
      const sigma = 24 + 16*Math.min(1.5, L.weight || 1);
      const g = Math.exp(-(dx*dx+dy*dy)/(2*sigma*sigma));
      v += L.p * g * 0.14 * dentStrength;
    }
    return clamp(v, 0, 1.8);
  }

  function hsvToRgb(h,s,v){
    const c = v*s;
    const hh = (h % 360) / 60;
    const x = c*(1-Math.abs(hh%2-1));
    let r=0,g=0,b=0;
    if(hh>=0 && hh<1){ r=c; g=x; }
    else if(hh<2){ r=x; g=c; }
    else if(hh<3){ g=c; b=x; }
    else if(hh<4){ g=x; b=c; }
    else if(hh<5){ r=x; b=c; }
    else { r=c; b=x; }
    const m = v-c;
    return [
      Math.round((r+m)*255),
      Math.round((g+m)*255),
      Math.round((b+m)*255)
    ];
  }

  function rainbowTone(phase, fringe){
    // 明るめレインボー。色相による透明化は行わない。
    const hue = (phase * 120) % 360;
    const sat = 0.68 + 0.24*fringe;
    const val = 0.90 + 0.10*fringe;
    const rgb = hsvToRgb(hue, Math.min(1,sat), Math.min(1,val));
    return {rgb, alpha:235, hue};
  }

  function updateLoadsFromFingers(){
    activeLoads = [];
    const now = performance.now();
    const delayMs = Number(delayEl.value) * 1000;

    for(const f of fingertips){
      if(!f.visible){
        f.pressure = 0;
        continue;
      }

      const depth = signedInteriorDepth(f.x,f.y);
      let currentPressure = 0;

      if(depth > 0){
        const speed = Math.hypot(f.x-f.px, f.y-f.py);
        const depthTerm = clamp(depth/72, 0, 1);
        const speedTerm = clamp(speed/24, 0, 1);
        currentPressure = clamp(
          (0.16 + depthTerm*0.85 + speedTerm*0.55) * f.weight * (+pressureGainEl.value),
          0, 4
        );
      }

      f.pressure = currentPressure;

      f.history.push({
        t: now,
        x: f.x,
        y: f.y,
        p: currentPressure,
        weight: f.weight
      });

      while(f.history.length && now - f.history[0].t > 3500){
        f.history.shift();
      }

      let delayed = null;
      const target = now - delayMs;
      for(let i=f.history.length-1; i>=0; i--){
        if(f.history[i].t <= target){
          delayed = f.history[i];
          break;
        }
      }

      if(delayed && delayed.p > 0 && baseInside(delayed.x, delayed.y)){
        activeLoads.push({
          x: delayed.x,
          y: delayed.y,
          p: delayed.p,
          weight: delayed.weight
        });
        persistentLoads.push({
          x: delayed.x,
          y: delayed.y,
          p: delayed.p*0.11,
          weight: delayed.weight
        });
      }
    }

    if(activeLoads.length){
      const avg = activeLoads.reduce((s,l)=>s+l.p,0)/activeLoads.length;
      statusEl.innerHTML = `<strong>接触中:</strong> 人差し指・中指を検出中 / 干渉表示 ${activeLoads.length}点 / 平均圧 ${avg.toFixed(2)} / 遅延 ${(+delayEl.value).toFixed(2)}秒`;
    } else if(handsReady){
      statusEl.innerHTML = `<strong>待機中:</strong> 人差し指または中指を透明板に触れさせてください。干渉表示は ${(+delayEl.value).toFixed(2)} 秒後です。`;
    }
  }

  function renderSimulation(){
    const scale = W < 700 ? .34 : .42;
    const iw = Math.max(160, Math.floor(W*scale));
    const ih = Math.max(110, Math.floor(H*scale));
    if(off.width!==iw || off.height!==ih){
      off.width=iw; off.height=ih;
    }

    const img = offCtx.createImageData(iw,ih);
    const gain = +gainEl.value;

    for(let j=0;j<ih;j++){
      for(let i=0;i<iw;i++){
        const x=(i+.5)/iw*W, y=(j+.5)/ih*H;
        const k=(j*iw+i)*4;

        if(!baseInside(x,y)){
          img.data[k]=0; img.data[k+1]=0; img.data[k+2]=0; img.data[k+3]=0;
          continue;
        }

        const dent = dentField(x,y);
        const rawStress = stressField(x,y);
        const s = rawStress*gain + dent*1.35;

        // 荷重がない白枠内は完全に透明。
        if(rawStress < 0.004 && dent < 0.004){
          img.data[k]=0; img.data[k+1]=0; img.data[k+2]=0; img.data[k+3]=0;
          continue;
        }

        const phase = s*7.8 + dent*0.85;
        const fringe = .5 + .5*Math.cos(phase*Math.PI*2);

        if(modeEl.value==='mono'){
          let v = Math.floor(18 + 237*Math.pow(fringe,1.22));
          v = clamp(v - dent*34, 0, 255);
          img.data[k]=v; img.data[k+1]=v; img.data[k+2]=v;
          img.data[k+3]=225;
        } else {
          const tone = rainbowTone(phase*1.55, fringe);
          let shade = 0.88 + 0.20*fringe;
          shade *= (1 - dent*0.08);
          img.data[k]=clamp(tone.rgb[0]*shade,0,255);
          img.data[k+1]=clamp(tone.rgb[1]*shade,0,255);
          img.data[k+2]=clamp(tone.rgb[2]*shade,0,255);
          img.data[k+3]=tone.alpha;
        }
      }
    }

    offCtx.putImageData(img,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off,0,0,W,H);

    drawIndentationHighlights();
    drawWhiteFrame();

    const decay = +relaxEl.value;
    persistentLoads.forEach(L=>L.p*=decay);
    persistentLoads = persistentLoads.filter(L=>L.p>.012);
  }

  function drawIndentationHighlights(){
    ctx.save();
    for(const L of activeLoads){
      const r = 18 + (L.weight||1)*12;
      const a = Math.min(0.22, 0.05 + L.p*0.04);

      const shadow = ctx.createRadialGradient(L.x+4, L.y+5, 0, L.x+4, L.y+5, r*1.1);
      shadow.addColorStop(0, `rgba(0,0,0,${a})`);
      shadow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.arc(L.x+4, L.y+5, r*1.1, 0, Math.PI*2);
      ctx.fill();

      const highlight = ctx.createRadialGradient(L.x-5, L.y-6, 0, L.x-5, L.y-6, r*0.95);
      highlight.addColorStop(0, `rgba(255,255,255,${a*0.72})`);
      highlight.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = highlight;
      ctx.beginPath();
      ctx.arc(L.x-5, L.y-6, r*0.95, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWhiteFrame(){
    const {cx,cy,side}=specimenBounds();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.98)';
    ctx.lineWidth=1.8;
    ctx.strokeRect(cx-side/2, cy-side/2, side, side);

    ctx.strokeStyle='rgba(255,255,255,.22)';
    ctx.lineWidth=5.5;
    ctx.strokeRect(cx-side/2, cy-side/2, side, side);
    ctx.restore();
  }

  function drawHUD(){
    hctx.clearRect(0,0,W,H);

    for(const f of fingertips){
      if(!f.visible) continue;

      const touchingNow = f.pressure > 0.01;
      const radius = touchingNow ? 10 + f.pressure*4 : 7;

      hctx.beginPath();
      hctx.arc(f.x, f.y, radius, 0, Math.PI*2);
      hctx.strokeStyle = touchingNow ? 'rgba(125,211,252,.96)' : 'rgba(255,255,255,.45)';
      hctx.lineWidth = touchingNow ? 3 : 1.5;
      hctx.stroke();

      if(touchingNow){
        hctx.beginPath();
        hctx.arc(f.x, f.y, 3.5 + f.pressure*1.5, 0, Math.PI*2);
        hctx.fillStyle = 'rgba(125,211,252,.95)';
        hctx.fill();
      }

      hctx.font = '10px system-ui';
      hctx.textAlign = 'center';
      hctx.fillStyle = 'rgba(255,255,255,.88)';
      hctx.fillText(f.label, f.x, f.y - radius - 4);
    }

    if(activeLoads.length){
      hctx.font='14px system-ui';
      hctx.fillStyle='rgba(255,255,255,.92)';
      hctx.textAlign='center';
      hctx.fillText(`干渉 ${activeLoads.length}点`, W/2, 36);
    }
  }

  function animate(){
    renderSimulation();
    drawHUD();
    requestAnimationFrame(animate);
  }

  function onResults(results){
    fingertips.forEach(f => { f.visible = false; });

    const hands = results.multiHandLandmarks || [];
    hands.slice(0,2).forEach((lm, handIndex) => {
      TRACK_IDS.forEach((tipId, localIndex) => {
        const p = lm[tipId];
        const idx = handIndex*2 + localIndex;
        const f = fingertips[idx];
        const x = (1-p.x)*W;
        const y = p.y*H;

        f.visible = true;
        f.label = TRACK_LABELS[localIndex];
        f.weight = fingerWeights[f.label];
        f.px = f.x || x;
        f.py = f.y || y;
        f.x = f.x ? lerp(f.x, x, .42) : x;
        f.y = f.y ? lerp(f.y, y, .42) : y;
      });
    });

    updateLoadsFromFingers();
  }

  async function startCamera(){
    if(handsReady) return;
    startCamBtn.disabled = true;
    startCamBtn.textContent = '起動中…';

    try{
      const hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: .65,
        minTrackingConfidence: .65
      });

      hands.onResults(onResults);

      camera = new Camera(video, {
        onFrame: async () => { await hands.send({image:video}); },
        width: 1280,
        height: 720
      });

      await camera.start();
      handsReady = true;
      startCamBtn.textContent = 'カメラ起動済み';
      statusEl.innerHTML = `<strong>準備完了:</strong> 人差し指または中指を透明板に触れさせてください。干渉表示は ${(+delayEl.value).toFixed(2)} 秒後です。`;
    }catch(err){
      console.error(err);
      statusEl.innerHTML = '<strong>カメラ起動に失敗:</strong> HTTPS、カメラ許可、他アプリでの使用状況を確認してください。';
      startCamBtn.disabled = false;
      startCamBtn.textContent = 'カメラ開始';
    }
  }

  function resetAll(){
    activeLoads = [];
    persistentLoads = [];
    fingertips.forEach(f => {
      f.visible = false;
      f.pressure = 0;
      f.x = f.y = f.px = f.py = 0;
      f.history = [];
    });
    statusEl.innerHTML = `<strong>リセットしました。</strong> 干渉表示は ${(+delayEl.value).toFixed(2)} 秒後です。`;
  }

  [delayEl, frameScaleEl].forEach(el => el.addEventListener('input', updateReadouts));
  delayEl.addEventListener('input', () => {
    statusEl.innerHTML = `<strong>設定更新:</strong> 干渉表示の遅延を ${(+delayEl.value).toFixed(2)} 秒に変更しました。`;
  });
  frameScaleEl.addEventListener('input', () => {
    statusEl.innerHTML = `<strong>設定更新:</strong> 正方形サイズを ${(Number(frameScaleEl.value)*100).toFixed(0)} % に変更しました。`;
  });

  startCamBtn.addEventListener('click', startCamera);
  resetBtn.addEventListener('click', resetAll);
  window.addEventListener('resize', resize);

  resize();
  updateReadouts();
  animate();
})();
</script>
</body>
</html>
