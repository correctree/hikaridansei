<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Photoelasticity — Palm Weighted / Smooth Silhouette</title>
<style>
:root{
  --bg:#07090d;
  --panel:rgba(16,20,27,.78);
  --line:rgba(255,255,255,.18);
  --text:#f5f7fb;
  --muted:#aab2c0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;overflow:hidden}
.app{position:relative;width:100vw;height:100vh;background:#05070a}
video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scaleX(-1);filter:brightness(.42) saturate(.72) blur(1px);
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sim{z-index:2}
#hud{z-index:3;pointer-events:none}
.panel{
  position:absolute;z-index:5;left:16px;top:16px;width:min(410px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;backdrop-filter:blur(14px);
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input[type=range],button{width:100%}
select,button{
  border:1px solid var(--line);background:#121722;color:var(--text);
  border-radius:10px;padding:9px 10px;font-size:14px
}
button{cursor:pointer}
button.primary{background:#16384b;border-color:#285f7d}
button:disabled{opacity:.55;cursor:not-allowed}
.rangeWrap{margin-top:10px}
.status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.status strong{color:var(--text)}
.legend{
  position:absolute;z-index:5;right:16px;bottom:16px;max-width:390px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;backdrop-filter:blur(12px);font-size:12px;color:var(--muted);
  line-height:1.55
}
.badge{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--text)}
.small{font-size:11px;color:var(--muted)}
@media (max-width:640px){
  .panel{left:10px;top:10px;width:calc(100vw - 20px)}
  .legend{left:10px;right:10px;bottom:10px;max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <video id="video" playsinline muted></video>
  <canvas id="sim"></canvas>
  <canvas id="hud"></canvas>

  <div class="panel">
    <div class="row">
      <div>
        <label for="shape">試験片</label>
        <select id="shape">
          <option value="rect">長方形</option>
          <option value="disk">円板</option>
          <option value="hole">穴あき板</option>
        </select>
      </div>
      <div>
        <label for="mode">表示</label>
        <select id="mode">
          <option value="color">干渉色</option>
          <option value="mono">白黒縞</option>
        </select>
      </div>
    </div>

    <div class="rangeWrap">
      <label for="gain">光弾性感度</label>
      <input id="gain" type="range" min="1" max="14" value="7.4" step="0.1">
    </div>

    <div class="rangeWrap">
      <label for="pressureGain">全体圧力</label>
      <input id="pressureGain" type="range" min="0.3" max="3.5" value="1.35" step="0.05">
    </div>

    <div class="rangeWrap">
      <label for="palmBoost">手のひらブースト</label>
      <input id="palmBoost" type="range" min="1.0" max="3.0" value="1.9" step="0.05">
    </div>

    <div class="rangeWrap">
      <label for="dentStrength">へこみ表現</label>
      <input id="dentStrength" type="range" min="0" max="2.4" value="1.1" step="0.05">
    </div>

    <div class="rangeWrap">
      <label for="relax">残留時間</label>
      <input id="relax" type="range" min="0.82" max="0.99" value="0.94" step="0.005">
    </div>

    <div class="rangeWrap">
      <label for="density">面圧サンプル密度</label>
      <input id="density" type="range" min="10" max="26" value="16" step="1">
    </div>

    <div class="row" style="margin-top:10px">
      <button id="startCam" class="primary">カメラ開始</button>
      <button id="reset">リセット</button>
    </div>

    <div id="status" class="status">
      <strong>操作:</strong> 手のひらや指全体のシルエットを透明体に重ねてください。<br>
      手のひらを強めに、指は部位ごとに異なる重みで反応します。
    </div>
  </div>

  <div class="legend">
    <span class="badge">手のひら優先</span>　
    <span class="badge">指ごとの重み</span>　
    <span class="badge">局所へこみ</span><br>
    <div class="small">ベース技術: Google MediaPipe Hands（21点ランドマーク）</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const sim = document.getElementById('sim');
  const hud = document.getElementById('hud');
  const ctx = sim.getContext('2d');
  const hctx = hud.getContext('2d');

  const shapeSel = document.getElementById('shape');
  const modeSel = document.getElementById('mode');
  const gainEl = document.getElementById('gain');
  const pressureGainEl = document.getElementById('pressureGain');
  const palmBoostEl = document.getElementById('palmBoost');
  const dentStrengthEl = document.getElementById('dentStrength');
  const relaxEl = document.getElementById('relax');
  const densityEl = document.getElementById('density');
  const startCamBtn = document.getElementById('startCam');
  const resetBtn = document.getElementById('reset');
  const statusEl = document.getElementById('status');

  let W=0,H=0,DPR=1;
  let camera=null,handsReady=false;

  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');
  const sampleCanvas = document.createElement('canvas');
  const sampleCtx = sampleCanvas.getContext('2d', {willReadFrequently:true});

  let activeLoads = [];
  let persistentLoads = [];

  const fingerWeights = {
    thumb: 0.75,
    index: 1.10,
    middle: 1.00,
    ring: 0.85,
    pinky: 0.65
  };

  const fingerDefs = [
    {name:'thumb', ids:[1,2,3,4]},
    {name:'index', ids:[5,6,7,8]},
    {name:'middle', ids:[9,10,11,12]},
    {name:'ring', ids:[13,14,15,16]},
    {name:'pinky', ids:[17,18,19,20]}
  ];

  const palmIds = [0,1,5,9,13,17];

  const handsState = [
    {visible:false, rawPts:[], smoothPts:[], palmPts:[], centroid:{x:0,y:0}, prevCentroid:{x:0,y:0}, speed:0, area:0, handScale:1, fingerPolylines:[]},
    {visible:false, rawPts:[], smoothPts:[], palmPts:[], centroid:{x:0,y:0}, prevCentroid:{x:0,y:0}, speed:0, area:0, handScale:1, fingerPolylines:[]}
  ];

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const hypot = (x,y)=>Math.hypot(x,y);

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for(const c of [sim,hud]){
      c.width = Math.round(W*DPR);
      c.height = Math.round(H*DPR);
      c.style.width = W+'px';
      c.style.height = H+'px';
      c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
    }
    maskCanvas.width = W; maskCanvas.height = H;
    sampleCanvas.width = W; sampleCanvas.height = H;
  }

  function specimenBounds(){
    const sw = Math.min(W*.62, 720);
    const sh = Math.min(H*.48, 420);
    return {cx:W/2, cy:H/2+20, sw, sh};
  }

  function baseInside(x,y){
    const {cx,cy,sw,sh}=specimenBounds();
    const nx=(x-cx)/(sw/2), ny=(y-cy)/(sh/2);
    if(shapeSel.value==='disk') return nx*nx + ny*ny <= 1;
    if(shapeSel.value==='hole'){
      const outer=Math.abs(nx)<=1 && Math.abs(ny)<=1;
      const R=Math.min(sw,sh)*.18;
      const hole=((x-cx)**2 + (y-cy)**2) < R*R;
      return outer && !hole;
    }
    return Math.abs(nx)<=1 && Math.abs(ny)<=1;
  }

  function signedInteriorDepth(x,y){
    const {cx,cy,sw,sh}=specimenBounds();
    if(shapeSel.value==='disk'){
      const R=Math.min(sw,sh)/2;
      return R - Math.hypot(x-cx, y-cy);
    }
    if(shapeSel.value==='hole'){
      const left=x-(cx-sw/2), right=(cx+sw/2)-x;
      const top=y-(cy-sh/2), bottom=(cy+sh/2)-y;
      const outer=Math.min(left,right,top,bottom);
      const R=Math.min(sw,sh)*.18;
      const holeDist=Math.hypot(x-cx,y-cy)-R;
      return Math.min(outer, holeDist);
    }
    const left=x-(cx-sw/2), right=(cx+sw/2)-x;
    const top=y-(cy-sh/2), bottom=(cy+sh/2)-y;
    return Math.min(left,right,top,bottom);
  }

  function boundaryStress(x,y){
    const {cx,cy,sw,sh}=specimenBounds();
    if(shapeSel.value!=='hole') return 0;
    const rr=Math.hypot(x-cx,y-cy);
    const R=Math.min(sw,sh)*.18;
    return Math.exp(-Math.abs(rr-R)/16)*.7;
  }

  function polygonArea(pts){
    let a=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      a += p.x*q.y - q.x*p.y;
    }
    return Math.abs(a)*0.5;
  }

  function polygonCentroid(pts){
    let area=0, cx=0, cy=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      const cross = p.x*q.y - q.x*p.y;
      area += cross;
      cx += (p.x+q.x)*cross;
      cy += (p.y+q.y)*cross;
    }
    area *= 0.5;
    if(Math.abs(area) < 1e-6){
      const sx=pts.reduce((s,p)=>s+p.x,0)/pts.length;
      const sy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
      return {x:sx,y:sy};
    }
    return {x:cx/(6*area), y:cy/(6*area)};
  }

  function pointInPolygon(x,y,pts){
    let inside = false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
      const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-8)+xi);
      if(intersect) inside = !inside;
    }
    return inside;
  }

  function distPointToSegment(px,py,ax,ay,bx,by){
    const abx = bx-ax, aby = by-ay;
    const apx = px-ax, apy = py-ay;
    const ab2 = abx*abx + aby*aby || 1;
    const t = clamp((apx*abx + apy*aby)/ab2, 0, 1);
    const cx = ax + abx*t;
    const cy = ay + aby*t;
    return Math.hypot(px-cx, py-cy);
  }

  function minDistanceToPolyline(x,y,pts){
    let d = Infinity;
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      d = Math.min(d, distPointToSegment(x,y,a.x,a.y,b.x,b.y));
    }
    return d;
  }

  function catmullRomClosed(points, segmentsPerEdge=8){
    if(!points || points.length < 3) return points || [];
    const out = [];
    const n = points.length;
    for(let i=0;i<n;i++){
      const p0 = points[(i-1+n)%n];
      const p1 = points[i];
      const p2 = points[(i+1)%n];
      const p3 = points[(i+2)%n];
      for(let j=0;j<segmentsPerEdge;j++){
        const t = j/segmentsPerEdge;
        const t2 = t*t, t3=t2*t;
        const x = 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
        const y = 0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
        out.push({x,y});
      }
    }
    return out;
  }

  function buildHandOutline(lm){
    const p = i => ({x:(1-lm[i].x)*W, y:lm[i].y*H});
    const raw = [
      p(0),
      p(1), p(2), p(3), p(4),
      p(3), p(2), p(1),
      p(5), p(6), p(7), p(8),
      p(7), p(6), p(5),
      p(9), p(10), p(11), p(12),
      p(11), p(10), p(9),
      p(13), p(14), p(15), p(16),
      p(15), p(14), p(13),
      p(17), p(18), p(19), p(20),
      p(19), p(18), p(17),
      p(0)
    ];
    const smooth = catmullRomClosed(raw, 6);
    return {raw, smooth};
  }

  function drawPolygon(c, pts, fillStyle, strokeStyle, lineWidth=1){
    if(!pts || pts.length < 3) return;
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x, pts[i].y);
    c.closePath();
    if(fillStyle){ c.fillStyle = fillStyle; c.fill(); }
    if(strokeStyle){ c.strokeStyle = strokeStyle; c.lineWidth = lineWidth; c.stroke(); }
  }

  function getHandScale(lm){
    const p0 = {x:(1-lm[0].x)*W, y:lm[0].y*H};
    const p9 = {x:(1-lm[9].x)*W, y:lm[9].y*H};
    const p5 = {x:(1-lm[5].x)*W, y:lm[5].y*H};
    const p17= {x:(1-lm[17].x)*W, y:lm[17].y*H};
    return Math.max(20, 0.5*(Math.hypot(p0.x-p9.x,p0.y-p9.y)+Math.hypot(p5.x-p17.x,p5.y-p17.y)));
  }

  function pressureWeightAtPoint(x,y,hs){
    let weight = 0.18;
    const palmBoost = +palmBoostEl.value;

    if(hs.palmPts.length >= 3 && pointInPolygon(x,y,hs.palmPts)){
      weight = Math.max(weight, palmBoost);
    }

    const fingerWidth = hs.handScale * 0.18;
    for(const fp of hs.fingerPolylines){
      const d = minDistanceToPolyline(x,y,fp.pts);
      if(d < fingerWidth){
        const proximity = 1 - d/fingerWidth;
        weight = Math.max(weight, fp.weight * (0.55 + 0.45*proximity));
      }
    }
    return weight;
  }

  function buildHandMaskAndLoads(){
    activeLoads = [];
    maskCtx.clearRect(0,0,W,H);
    sampleCtx.clearRect(0,0,W,H);

    const step = +densityEl.value;
    let overlapSamples = 0;

    for(const hs of handsState){
      if(!hs.visible || hs.smoothPts.length < 3) continue;
      drawPolygon(maskCtx, hs.smoothPts, 'rgba(255,255,255,1)', null);
    }
    sampleCtx.drawImage(maskCanvas, 0, 0);

    for(const hs of handsState){
      if(!hs.visible || hs.smoothPts.length < 3) continue;

      const xs = hs.smoothPts.map(p=>p.x);
      const ys = hs.smoothPts.map(p=>p.y);
      const minX = Math.max(0, Math.floor(Math.min(...xs)));
      const maxX = Math.min(W-1, Math.ceil(Math.max(...xs)));
      const minY = Math.max(0, Math.floor(Math.min(...ys)));
      const maxY = Math.min(H-1, Math.ceil(Math.max(...ys)));

      const speedTerm = clamp(hs.speed/24, 0, 1);
      const areaTerm = clamp(hs.area/22000, 0, 1.25);

      for(let y=minY; y<=maxY; y+=step){
        for(let x=minX; x<=maxX; x+=step){
          if(!baseInside(x,y)) continue;
          const alpha = sampleCtx.getImageData(x, y, 1, 1).data[3];
          if(alpha < 10) continue;

          const depth = signedInteriorDepth(x,y);
          if(depth <= 0) continue;

          const depthTerm = clamp(depth/95, 0, 1);
          const regionWeight = pressureWeightAtPoint(x,y,hs);

          const p = clamp(
            (0.11 + depthTerm*0.95 + speedTerm*0.45 + areaTerm*0.18)
            * regionWeight
            * (+pressureGainEl.value),
            0, 4
          );

          activeLoads.push({x,y,p,regionWeight});
          if((x+y) % (step*2) === 0){
            persistentLoads.push({x,y,p:p*0.08});
          }
          overlapSamples++;
        }
      }
    }

    if(overlapSamples){
      const avg = activeLoads.reduce((s,l)=>s+l.p,0)/Math.max(activeLoads.length,1);
      statusEl.innerHTML = `<strong>接触中:</strong> 面圧サンプル ${overlapSamples}点 / 平均圧 ${avg.toFixed(2)}`;
    }else if(handsReady){
      statusEl.innerHTML = '<strong>待機中:</strong> 手のシルエットを透明体に重ねてください。';
    }
  }

  function stressField(x,y){
    let sx=0, sy=0, tau=0;
    const loads = activeLoads.concat(persistentLoads);

    for(const L of loads){
      const dx=x-L.x, dy=y-L.y;
      const r2=dx*dx+dy*dy+110;
      const r=Math.sqrt(r2);
      const nx=dx/r, ny=dy/r;
      const k=L.p*8800/r2;
      sx += k*(1.75*nx*nx+.25);
      sy += k*(1.75*ny*ny+.25);
      tau += k*(1.6*nx*ny);
    }

    const diff=Math.sqrt((sx-sy)*(sx-sy)+4*tau*tau);
    return diff + boundaryStress(x,y);
  }

  function dentField(x,y){
    let v = 0;
    const dentStrength = +dentStrengthEl.value;
    for(const L of activeLoads){
      const dx = x-L.x, dy = y-L.y;
      const sigma = 26 + 18*Math.min(1.5, L.regionWeight || 1);
      const g = Math.exp(-(dx*dx+dy*dy)/(2*sigma*sigma));
      v += L.p * g * 0.12 * dentStrength;
    }
    return clamp(v, 0, 1.6);
  }

  function spectral(v){
    return [
      Math.floor(30+225*(.5+.5*Math.sin(v))),
      Math.floor(30+225*(.5+.5*Math.sin(v+2.094))),
      Math.floor(30+225*(.5+.5*Math.sin(v+4.188)))
    ];
  }

  function renderSimulation(){
    const scale = W < 700 ? .32 : .40;
    const iw = Math.max(150, Math.floor(W*scale));
    const ih = Math.max(100, Math.floor(H*scale));
    if(off.width!==iw || off.height!==ih){
      off.width=iw; off.height=ih;
    }

    const img = offCtx.createImageData(iw,ih);
    const gain = +gainEl.value;

    for(let j=0;j<ih;j++){
      for(let i=0;i<iw;i++){
        const x=(i+.5)/iw*W, y=(j+.5)/ih*H;
        const k=(j*iw+i)*4;

        if(!baseInside(x,y)){
          img.data[k]=0; img.data[k+1]=0; img.data[k+2]=0; img.data[k+3]=0;
          continue;
        }

        const dent = dentField(x,y);
        const s = stressField(x,y)*gain + dent*1.4;
        const phase = s*8.0 + dent*0.8;
        const fringe = .5 + .5*Math.cos(phase*Math.PI*2);

        if(modeSel.value==='mono'){
          let v=Math.floor(18+237*Math.pow(fringe,1.22));
          v = clamp(v - dent*36, 0, 255);
          img.data[k]=v; img.data[k+1]=v; img.data[k+2]=v;
        }else{
          const rgb=spectral(phase*1.55);
          let shade=.42+.58*fringe;
          shade *= (1 - dent*0.15);
          img.data[k]=clamp(rgb[0]*shade,0,255);
          img.data[k+1]=clamp(rgb[1]*shade,0,255);
          img.data[k+2]=clamp(rgb[2]*shade,0,255);
        }
        img.data[k+3]=225;
      }
    }

    offCtx.putImageData(img,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off,0,0,W,H);

    drawIndentationHighlights();
    drawOutline();

    const decay = +relaxEl.value;
    persistentLoads.forEach(L=>L.p*=decay);
    persistentLoads = persistentLoads.filter(L=>L.p>.012);
  }

  function drawIndentationHighlights(){
    ctx.save();
    for(const L of activeLoads){
      const r = 18 + (L.regionWeight||1)*10;
      const a = Math.min(0.22, 0.06 + L.p*0.04);

      const shadow = ctx.createRadialGradient(L.x+4, L.y+5, 0, L.x+4, L.y+5, r*1.1);
      shadow.addColorStop(0, `rgba(0,0,0,${a})`);
      shadow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.arc(L.x+4, L.y+5, r*1.1, 0, Math.PI*2);
      ctx.fill();

      const highlight = ctx.createRadialGradient(L.x-5, L.y-6, 0, L.x-5, L.y-6, r*0.95);
      highlight.addColorStop(0, `rgba(255,255,255,${a*0.75})`);
      highlight.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = highlight;
      ctx.beginPath();
      ctx.arc(L.x-5, L.y-6, r*0.95, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawOutline(){
    const {cx,cy,sw,sh}=specimenBounds();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.55)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    if(shapeSel.value==='disk'){
      ctx.arc(cx,cy,Math.min(sw,sh)/2,0,Math.PI*2);
    }else{
      ctx.rect(cx-sw/2,cy-sh/2,sw,sh);
    }
    ctx.stroke();

    if(shapeSel.value==='hole'){
      ctx.beginPath();
      ctx.arc(cx,cy,Math.min(sw,sh)*.18,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD(){
    hctx.clearRect(0,0,W,H);

    for(const hs of handsState){
      if(!hs.visible || hs.smoothPts.length < 3) continue;
      drawPolygon(
        hctx,
        hs.smoothPts,
        'rgba(125,211,252,.10)',
        'rgba(125,211,252,.88)',
        2
      );

      if(hs.palmPts.length >= 3){
        drawPolygon(
          hctx,
          hs.palmPts,
          'rgba(255,255,255,.07)',
          'rgba(255,255,255,.32)',
          1.2
        );
      }

      for(const fp of hs.fingerPolylines){
        hctx.beginPath();
        hctx.moveTo(fp.pts[0].x, fp.pts[0].y);
        for(let i=1;i<fp.pts.length;i++) hctx.lineTo(fp.pts[i].x, fp.pts[i].y);
        hctx.strokeStyle = 'rgba(255,255,255,.18)';
        hctx.lineWidth = hs.handScale * 0.06;
        hctx.lineCap = 'round';
        hctx.lineJoin = 'round';
        hctx.stroke();
      }

      hctx.beginPath();
      hctx.arc(hs.centroid.x, hs.centroid.y, 5, 0, Math.PI*2);
      hctx.fillStyle='rgba(255,255,255,.92)';
      hctx.fill();

      hctx.font='12px system-ui';
      hctx.fillStyle='rgba(255,255,255,.96)';
      hctx.textAlign='center';
      hctx.fillText(`v ${hs.speed.toFixed(1)}`, hs.centroid.x, hs.centroid.y - 10);
    }

    if(activeLoads.length){
      hctx.font='14px system-ui';
      hctx.fillStyle='rgba(255,255,255,.92)';
      hctx.textAlign='center';
      hctx.fillText(`面圧 ${activeLoads.length}点`, W/2, 36);
    }
  }

  function animate(){
    renderSimulation();
    drawHUD();
    requestAnimationFrame(animate);
  }

  function onResults(results){
    handsState.forEach(h=>h.visible=false);

    const hands = results.multiHandLandmarks || [];
    hands.slice(0,2).forEach((lm,hIndex)=>{
      const hs = handsState[hIndex];
      const outline = buildHandOutline(lm);
      hs.visible = true;
      hs.rawPts = outline.raw;
      hs.smoothPts = outline.smooth;
      hs.area = polygonArea(hs.smoothPts);
      hs.handScale = getHandScale(lm);

      hs.palmPts = palmIds.map(id => ({x:(1-lm[id].x)*W, y:lm[id].y*H}));
      hs.fingerPolylines = fingerDefs.map(def => ({
        name:def.name,
        weight:fingerWeights[def.name],
        pts:def.ids.map(id => ({x:(1-lm[id].x)*W, y:lm[id].y*H}))
      }));

      const nextCentroid = polygonCentroid(hs.smoothPts);
      if(!hs.centroid.x && !hs.centroid.y){
        hs.centroid = nextCentroid;
        hs.prevCentroid = nextCentroid;
      }else{
        hs.prevCentroid = {x:hs.centroid.x, y:hs.centroid.y};
        hs.centroid = {
          x: lerp(hs.centroid.x, nextCentroid.x, .45),
          y: lerp(hs.centroid.y, nextCentroid.y, .45)
        };
      }
      hs.speed = Math.hypot(hs.centroid.x - hs.prevCentroid.x, hs.centroid.y - hs.prevCentroid.y);
    });

    buildHandMaskAndLoads();
  }

  async function startCamera(){
    if(handsReady) return;
    startCamBtn.disabled = true;
    startCamBtn.textContent = '起動中…';

    try{
      const hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: .65,
        minTrackingConfidence: .65
      });

      hands.onResults(onResults);

      camera = new Camera(video, {
        onFrame: async () => { await hands.send({image:video}); },
        width: 1280,
        height: 720
      });

      await camera.start();
      handsReady = true;
      startCamBtn.textContent = 'カメラ起動済み';
      statusEl.innerHTML = '<strong>準備完了:</strong> 手のシルエットを透明体に重ねてください。';
    }catch(err){
      console.error(err);
      statusEl.innerHTML = '<strong>カメラ起動に失敗:</strong> HTTPS、カメラ許可、他アプリでの使用状況を確認してください。';
      startCamBtn.disabled = false;
      startCamBtn.textContent = 'カメラ開始';
    }
  }

  startCamBtn.addEventListener('click', startCamera);
  resetBtn.addEventListener('click', ()=>{
    activeLoads = [];
    persistentLoads = [];
    handsState.forEach(h=>{
      h.visible=false;
      h.rawPts=[];
      h.smoothPts=[];
      h.palmPts=[];
      h.fingerPolylines=[];
      h.speed=0;
      h.area=0;
      h.centroid={x:0,y:0};
      h.prevCentroid={x:0,y:0};
    });
    statusEl.innerHTML = '<strong>リセットしました。</strong>';
  });

  shapeSel.addEventListener('change', ()=>{
    activeLoads = [];
    persistentLoads = [];
  });

  window.addEventListener('resize', resize);
  resize();
  animate();
})();
</script>
</body>
</html>
